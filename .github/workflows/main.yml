name: Update Subscription

on:
  schedule:
    # Запуск каждый день в 03:00 UTC (примерно 6:00 МСК)
    - cron: '0 3 * * *'
  # Также можно запускать вручную из интерфейса Actions
  workflow_dispatch:
  # И при пуше в основную ветку (опционально)
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm

      - name: Run parser
        run: |
          python parser.py --max-total 500 --output subscription.txt

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add subscription.txt subscription_b64.txt
          git diff --staged --quiet || git commit -m "Auto-update subscription $(date '+%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (опционально)
        uses: actions/upload-artifact@v4
        with:
          name: subscription-files
          path: |
            subscription.txt
            subscription_b64.txt
